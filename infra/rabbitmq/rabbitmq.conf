# RabbitMQ 4.4 do KAI (M03 E2.1; ADR-0003, ADR-0016). Topologia em
# definitions.template.json, carregada no arranque. Nenhum serviço declara
# exchanges nem filas (permissão "configure" vazia). Atenção: o import é
# aditivo; ver docs/engineering/rabbitmq.md ("Alterar a topologia").
load_definitions = /tmp/kai-rabbitmq/definitions.json

# SPEC-003 §6 [H]: limite por mensagem (16 MiB).
max_message_size = 16777216

# Abaixo deste espaço livre, o broker bloqueia os publishers em vez de encher
# o disco (revisão de segurança da E2.1, achado 4).
disk_free_limit.absolute = 2GB

# O guest não existe (as definições não o criam). A gestão (HTTP) só escuta
# dentro do contentor: nenhum outro contentor da rede lhe chega (revisão de
# segurança da E2.1, achado 1). Acesso: docker compose exec rabbitmq ...
loopback_users = none
management.tcp.ip = 127.0.0.1

# A distribuição Erlang (controlo do nó; só a usam o rabbitmqctl e afins,
# dentro do contentor) também só escuta em loopback. O epmd fica preso pelo
# ERL_EPMD_ADDRESS no docker-compose.yml.
distribution.listener.interface = 127.0.0.1

# Logs para a consola do contentor, sem o conteúdo das mensagens.
log.console = true
log.console.level = info
log.file = false
