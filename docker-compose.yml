# Portas publicadas só em loopback (revisão de segurança da E4.6b): nada
# fica exposto à rede local. No Docker Desktop, o browser do Windows continua
# a chegar a http://localhost:5173.

# Reverb (M03 E1.1, ADR-0009): o api publica por HTTP no serviço reverb, e o
# browser liga-se por WebSocket a localhost:8080. Os valores por omissão são de
# desenvolvimento; noutro ambiente vêm do ficheiro de ambiente (.env.example).
x-reverb-env: &reverb-env
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:-kai-local}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-kai-local-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-changeme-local-reverb}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:5173}

services:
  mysql:
    # Imagens fixadas por digest (ADR-0014); actualizar é uma alteração revista.
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kai}
      MYSQL_USER: ${DB_USERNAME:-kai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kai}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-kai_root}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kai}
      DB_USERNAME: ${DB_USERNAME:-kai}
      DB_PASSWORD: ${DB_PASSWORD:-kai}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:5173}
      <<: *reverb-env
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
    ports:
      - "127.0.0.1:8000:8000"
    # telemetry: emite para o otel-lgtm (M03 E7.1; hoje só os testes de integração).
    # messaging: RabbitMQ (relay do outbox e consumidor de eventos).
    networks: [default, messaging, telemetry]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /up é a rota de health check nativa do Laravel (bootstrap/app.php).
      # Importante: um "não é false" não chega — um erro fatal do PHP com
      # display_errors ligado também devolve HTTP 200 com HTML de erro, por
      # isso confirma o conteúdo esperado, não só que respondeu algo.
      test: ["CMD", "php", "-r", "exit(str_contains(@file_get_contents('http://localhost:8000/up') ?: '', 'PHP Fatal error') || !@file_get_contents('http://localhost:8000/up') ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 10

  reverb:
    # Mesma imagem e código do api; só o comando muda. Espera pelo api para o
    # entrypoint não criar o ficheiro de ambiente e a APP_KEY em concorrência.
    build:
      context: ./apps/api
    # messaging: o ai-engine publica deltas pela API HTTP (ADR-0015, E3.4).
    networks: [default, messaging]
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      APP_ENV: local
      <<: *reverb-env
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    # M03 E2.1 (ADR-0003, ADR-0016). Topologia versionada em infra/rabbitmq/.
    # Sem passwords por omissão: o contentor recusa arrancar sem passwords
    # fortes (gera-as com scripts/dev/passwords.sh). O AMQP (5672)
    # fica só na rede interna; a gestão escuta só dentro do contentor e não há
    # portas publicadas no host.
    # Profile "messaging": fica fora do `docker compose up` por omissão até haver
    # consumidores (E3.4/E4.4), para um clone limpo arrancar sem passwords
    # (AC-01). Arranca com: docker compose --profile messaging up -d
    profiles: ["messaging"]
    # Só na rede messaging: chegam-lhe o api e o ai-engine, não o web nem o MySQL.
    networks: [messaging]
    image: rabbitmq:4.4-management@sha256:61f90c401a5b5ed2486771973ea92ad66046471eacab9c9149f1a6e091c91677
    hostname: rabbitmq
    entrypoint: ["/bin/sh", "/etc/rabbitmq/render-definitions.sh"]
    environment:
      KAI_RABBITMQ_ADMIN_PASSWORD: ${KAI_RABBITMQ_ADMIN_PASSWORD:-}
      KAI_RABBITMQ_API_PASSWORD: ${KAI_RABBITMQ_API_PASSWORD:-}
      KAI_RABBITMQ_AI_ENGINE_PASSWORD: ${KAI_RABBITMQ_AI_ENGINE_PASSWORD:-}
      # Distribuição Erlang e epmd só em loopback; o nó chama-se pelo
      # loopback para o rabbitmqctl o encontrar (revisão de segurança da E2.1).
      ERL_EPMD_ADDRESS: 127.0.0.1
      RABBITMQ_NODENAME: rabbit@localhost
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.template.json:/etc/rabbitmq/definitions.template.json:ro
      - ./infra/rabbitmq/render-definitions.sh:/etc/rabbitmq/render-definitions.sh:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_listener 5672"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  ai-engine:
    # M03 E3.2 (SPEC-004): AI Engine em Python. Sem porta publicada no host
    # (ADR-0010): o Laravel e os testes chegam-lhe por http://ai-engine:8000.
    # Profile "messaging": precisa do RabbitMQ e das passwords.
    profiles: ["messaging"]
    build:
      context: ./apps/ai-engine
      target: runtime
      # Os schemas dos contratos entram na imagem (validação sem rede).
      additional_contexts:
        contracts: ./packages/contracts
    environment:
      RABBITMQ_HOST: rabbitmq
      KAI_RABBITMQ_AI_ENGINE_PASSWORD: ${KAI_RABBITMQ_AI_ENGINE_PASSWORD:-}
      KAI_AI_ENGINE_REDIS_PASSWORD: ${KAI_AI_ENGINE_REDIS_PASSWORD:-}
      # LLM (ADR-0006, M03 E3.3): fake por omissão; um fornecedor real sem chave
      # falha no arranque (AC-004-03).
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-}
      ANTHROPIC_FALLBACK_MODELS: ${ANTHROPIC_FALLBACK_MODELS:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      # Comportamento do fake para os testes de integração (vazio = omissão).
      KAI_FAKE_DELAY_PER_DELTA: ${KAI_FAKE_DELAY_PER_DELTA:-0}
      KAI_FAKE_WORDS_PER_DELTA: ${KAI_FAKE_WORDS_PER_DELTA:-2}
      KAI_FAKE_FAIL_BEFORE_FIRST_DELTA: ${KAI_FAKE_FAIL_BEFORE_FIRST_DELTA:-0}
      KAI_FAKE_USD_PER_MTOK: ${KAI_FAKE_USD_PER_MTOK:-0}
      KAI_FAKE_SCRIPT: ${KAI_FAKE_SCRIPT:-}
    # Só messaging (RabbitMQ, Reverb, api), telemetry e a rede interna da sua
    # inbox: sem acesso ao MySQL nem ao Redis do Laravel (ADR-0002; revisão de
    # segurança da E3.2, testado).
    networks: [messaging, telemetry, ai-engine-data]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid,nodev"]
    mem_limit: 512m
    # Drain de 10 s (consumer.py) mais a publicação do usage interrompido (3 s), antes do SIGKILL.
    stop_grace_period: 20s
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      ai-engine-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-I", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  ai-engine-redis:
    # M03 E3.4a (P-020): inbox do AI Engine, separada do Redis do Laravel. A
    # mesma imagem do redis (por digest). Sem portas; rede interna só com o
    # ai-engine; utilizador `default` desligado e ACL limitada à inbox
    # (infra/ai-engine-redis/start.sh). AOF num volume próprio.
    profiles: ["messaging"]
    image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    entrypoint: ["/bin/sh", "/kai/start.sh"]
    user: redis
    environment:
      KAI_AI_ENGINE_REDIS_PASSWORD: ${KAI_AI_ENGINE_REDIS_PASSWORD:-}
    volumes:
      - ./infra/ai-engine-redis/start.sh:/kai/start.sh:ro
      - ai_engine_redis_data:/data
    networks: [ai-engine-data]
    read_only: true
    tmpfs: ["/tmp:size=1m,noexec,nosuid,nodev"]
    mem_limit: 128m
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Sem password: basta o servidor responder (NOAUTH também prova que está vivo).
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-lgtm:
    # M03 E2.2 (ADR-0017, observability.md): colector OTLP, Tempo, Loki,
    # Prometheus e Grafana num só contentor, só para dev. O start.sh desliga
    # o Grafana anónimo (que a imagem traz como Admin) e a descarga de plugins,
    # e exige uma password de admin forte. Telemetria efémera (sem volume).
    # Só o Grafana é publicado no host, em loopback. Arranca com:
    #   docker compose --profile observability up -d
    profiles: ["observability"]
    image: grafana/otel-lgtm:0.40.0@sha256:72e05804790e6e0d8c0b70a6d5ff1f721ef7b203463374631e99aa3429bd0cf6
    entrypoint: ["/bin/sh", "/kai/start.sh"]
    environment:
      KAI_GRAFANA_ADMIN_PASSWORD: ${KAI_GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - ./infra/otel-lgtm/start.sh:/kai/start.sh:ro
    # Rede própria: só quem emite telemetria (api) chega ao OTLP e às APIs de
    # consulta sem autenticação; mysql, redis, rabbitmq, web e reverb não.
    networks: [telemetry]
    ports:
      # KAI_GRAFANA_HOST_PORT vazio = porta efémera (o integration.sh usa-o
      # para não colidir com o Grafana de dev).
      - "127.0.0.1:${KAI_GRAFANA_HOST_PORT-3000}:3000"
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
  messaging:
  telemetry:
  # Sem saída: só o ai-engine e o seu Redis.
  ai-engine-data:
    internal: true

volumes:
  mysql_data:
  rabbitmq_data:
  ai_engine_redis_data:
  api_vendor:
  web_node_modules:
